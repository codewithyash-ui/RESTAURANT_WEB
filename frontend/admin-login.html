<!-- frontend/admin-login.html - Admin Login Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Spice & Crust</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 theme-warm">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 transform hover:scale-105 transition-all duration-300">
      <div class="text-center mb-8">
        <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4" style="background-color: var(--primary)">
          <i class="fas fa-user-shield text-3xl text-white"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800">Admin Login</h2>
        <p class="text-gray-600 mt-2">Enter credentials to access dashboard</p>
      </div>
      
      <form id="admin-login-form">
        <div class="mb-6">
          <label class="block text-gray-700 font-medium mb-2">Admin Email</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
            <input type="email" id="admin-email" placeholder="admin@spiceandcrust.com" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 transition">
          </div>
        </div>
        
        <div class="mb-6">
          <label class="block text-gray-700 font-medium mb-2">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
            <input type="password" id="admin-password" placeholder="Enter password" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 transition">
          </div>
        </div>
        
        <button type="submit" class="w-full text-white py-3 rounded-lg font-semibold transition transform hover:scale-105" style="background-color: var(--primary)">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        
        <div id="login-error" class="mt-4 hidden p-3 rounded-lg text-center"></div>
      </form>
      
      <div class="mt-6 text-center">
        <a href="/" class="text-sm text-gray-500 hover:transition" style="color: var(--primary)">
          <i class="fas fa-arrow-left"></i> Back to Website
        </a>
      </div>
    </div>
  </div>
  
  <script>
    // Admin credentials (you can change these)
    const ADMIN_EMAIL = "admin@spiceandcrust.com";
    const ADMIN_PASSWORD = "admin123";
    
    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const errorDiv = document.getElementById('login-error');
      
      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        // Store admin session
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminEmail', email);
        // Redirect to admin panel
        window.location.href = '/admin.html';
      } else {
        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Invalid email or password!';
        errorDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
        errorDiv.classList.remove('hidden');
        
        setTimeout(() => {
          errorDiv.classList.add('hidden');
        }, 3000);
      }
    });
  </script>
</body>
</html>
