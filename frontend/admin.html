<!-- frontend/admin.html - Protected Admin Panel -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Order Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 theme-warm">
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center flex-wrap">
      <a href="/" class="text-2xl font-bold" style="color: var(--primary)"><i class="fas fa-utensils"></i> Spice & Crust</a>
      <div class="space-x-6">
        <a href="/" class="text-gray-700 hover:transition">Home</a>
        <a href="/menu.html" class="text-gray-700 hover:transition">Menu</a>
        <a href="/order.html" class="text-white px-4 py-2 rounded-full hover:transition" style="background-color: var(--primary)">Order Now</a>
        <a href="/cart.html" class="text-gray-700 hover:transition">Cart</a>
        <a href="/admin-login.html" class="font-semibold" style="color: var(--primary)">Admin</a>
        <a href="#" id="logout-btn" class="text-red-600 hover:text-red-700 transition">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-12">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard - Orders</h1>
      <div class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-sm">
        <i class="fas fa-user-shield"></i> Admin: <span id="admin-email-display">Loading...</span>
      </div>
    </div>
    
    <div id="admin-message" class="mb-4"></div>
    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full table-auto">
        <thead class="bg-gray-200">
          <tr><th class="px-4 py-3 text-left">Order ID</th><th class="px-4 py-3 text-left">Customer</th><th class="px-4 py-3 text-left">Items</th><th class="px-4 py-3 text-left">Total</th><th class="px-4 py-3 text-left">Status</th><th class="px-4 py-3 text-left">Date</th></tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan="6" class="text-center py-8">Loading orders......</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Theme Toggle Button -->
  <div class="theme-toggle-btn bg-white shadow-lg rounded-full">
    <button id="theme-toggle" class="flex items-center gap-2 px-4 py-2 rounded-full" style="color: var(--primary)">
      <i class="fas fa-palette"></i>
      <span class="hidden sm:inline">Themes</span>
    </button>
  </div>

  <!-- Theme Menu -->
  <div id="theme-menu" class="fixed bottom-20 right-20 bg-white rounded-lg shadow-xl z-50 hidden w-48">
    <div class="p-2">
      <h3 class="text-sm font-semibold text-gray-600 px-3 py-2">Choose Theme</h3>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="warm">
        <div class="w-6 h-6 rounded-full bg-orange-600"></div>
        <span>Warm Bakery</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="green">
        <div class="w-6 h-6 rounded-full bg-green-600"></div>
        <span>Fresh & Green</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="purple">
        <div class="w-6 h-6 rounded-full bg-purple-600"></div>
        <span>Royal Purple</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="red">
        <div class="w-6 h-6 rounded-full bg-red-600"></div>
        <span>Red & Spicy</span>
      </div>
    </div>
  </div>

  <footer class="bg-gray-800 text-white text-center py-6 mt-12">
    <p>&copy; 2025 Spice & Crust - Authentic Indian Bakery. All rights reserved.</p>
  </footer>

  <script src="js/admin.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Check if admin is logged in
    function checkAdminAuth() {
      const isLoggedIn = localStorage.getItem('adminLoggedIn');
      const adminEmail = localStorage.getItem('adminEmail');
      
      if (!isLoggedIn || isLoggedIn !== 'true') {
        window.location.href = '/admin-login.html';
        return false;
      }
      
      // Display admin email
      const emailDisplay = document.getElementById('admin-email-display');
      if (emailDisplay && adminEmail) {
        emailDisplay.textContent = adminEmail;
      }
      
      return true;
    }
    
    // Logout function
    function logout() {
      localStorage.removeItem('adminLoggedIn');
      localStorage.removeItem('adminEmail');
      window.location.href = '/admin-login.html';
    }
    
    // Check authentication on page load
    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAdminAuth()) return;
      
      // Setup logout button
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
          e.preventDefault();
          logout();
        });
      }
    });
  </script>
</body>
</html>
