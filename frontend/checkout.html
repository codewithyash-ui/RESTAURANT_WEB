<!-- frontend/checkout.html - Updated with Theme Toggle -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Spice & Crust Bakery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 theme-warm">
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4">
      <div class="flex justify-between items-center flex-wrap">
        <a href="/" class="text-2xl font-bold" style="color: var(--primary)"><i class="fas fa-utensils"></i> Spice & Crust</a>
        <div class="space-x-6">
          <a href="/" class="text-gray-700 hover:transition">Home</a>
          <a href="/menu.html" class="text-gray-700 hover:transition">Menu</a>
          <a href="/about.html" class="text-gray-700 hover:transition">About</a>
          <a href="/contact.html" class="text-gray-700 hover:transition">Contact</a>
          <a href="/order.html" class="text-white px-4 py-2 rounded-full hover:transition" style="background-color: var(--primary)">Order Now</a>
          <a href="/cart.html" class="text-gray-700 hover:transition relative">
            <i class="fas fa-shopping-bag"></i> Cart
            <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-12 max-w-3xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Checkout</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
      <div id="checkout-items"></div>
      <p class="text-right text-xl font-bold mt-4">Total: ₹<span id="checkout-total">0.00</span></p>
    </div>

    <form id="checkout-form" class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold mb-4">Customer Information</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <input type="text" id="fullname" placeholder="Full Name" required class="border p-3 rounded focus:outline-none" style="border-color: var(--primary); focus:border-color: var(--primary)">
        <input type="email" id="email" placeholder="Email" required class="border p-3 rounded focus:outline-none" style="border-color: var(--primary)">
        <input type="tel" id="phone" placeholder="Phone Number" required class="border p-3 rounded focus:outline-none" style="border-color: var(--primary)">
        <input type="text" id="address" placeholder="Delivery Address" required class="border p-3 rounded md:col-span-2 focus:outline-none" style="border-color: var(--primary)">
      </div>

      <h2 class="text-xl font-semibold mb-4">Payment Details (Dummy - No Validation)</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <input type="text" id="card-number" placeholder="Card Number (any numbers)" class="border p-3 rounded focus:outline-none" style="border-color: var(--primary)">
        <input type="text" id="expiry" placeholder="MM/YY (any)" class="border p-3 rounded focus:outline-none" style="border-color: var(--primary)">
        <input type="text" id="cvv" placeholder="CVV (any)" class="border p-3 rounded focus:outline-none" style="border-color: var(--primary)">
      </div>
      
      <div id="form-message" class="mb-4 hidden p-3 rounded"></div>
      <button type="submit" id="submit-order" class="w-full text-white px-8 py-3 rounded-full text-lg font-semibold transition transform hover:scale-105" style="background-color: var(--primary)">
        Place Order <i class="fas fa-check-circle"></i>
      </button>
    </form>
  </div>

  <!-- Theme Toggle Button -->
  <div class="theme-toggle-btn bg-white shadow-lg rounded-full">
    <button id="theme-toggle" class="flex items-center gap-2 px-4 py-2 rounded-full" style="color: var(--primary)">
      <i class="fas fa-palette"></i>
      <span class="hidden sm:inline">Themes</span>
    </button>
  </div>

  <!-- Theme Menu -->
  <div id="theme-menu" class="fixed bottom-20 right-20 bg-white rounded-lg shadow-xl z-50 hidden w-48">
    <div class="p-2">
      <h3 class="text-sm font-semibold text-gray-600 px-3 py-2">Choose Theme</h3>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="warm">
        <div class="w-6 h-6 rounded-full bg-orange-600"></div>
        <span>Warm Bakery</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="green">
        <div class="w-6 h-6 rounded-full bg-green-600"></div>
        <span>Fresh & Green</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="purple">
        <div class="w-6 h-6 rounded-full bg-purple-600"></div>
        <span>Royal Purple</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="red">
        <div class="w-6 h-6 rounded-full bg-red-600"></div>
        <span>Red & Spicy</span>
      </div>
    </div>
  </div>

  <footer class="bg-gray-800 text-white text-center py-6 mt-12">
    <p>&copy; 2025 Spice & Crust - Authentic Indian Bakery. All rights reserved.</p>
  </footer>

  <script src="js/checkout.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
