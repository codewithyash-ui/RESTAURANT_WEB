<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Order Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center flex-wrap">
      <a href="index.html" class="text-2xl font-bold" style="color: #ea580c"><i class="fas fa-utensils"></i> Spice & Crust</a>
      <div class="space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-orange-600 transition">Home</a>
        <a href="menu.html" class="text-gray-700 hover:text-orange-600 transition">Menu</a>
        <a href="order.html" class="text-white px-4 py-2 rounded-full hover:bg-orange-700 transition" style="background-color: #ea580c">Order Now</a>
        <a href="cart.html" class="text-gray-700 hover:text-orange-600 transition">Cart</a>
        <a href="admin-login.html" class="font-semibold" style="color: #ea580c">Admin</a>
        <a href="#" id="logout-btn" class="text-red-600 hover:text-red-700 transition"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-12">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard - Orders</h1>
      <div class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-sm"><i class="fas fa-user-shield"></i> Admin</div>
    </div>
    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full table-auto">
        <thead class="bg-gray-200">
          <tr><th class="px-4 py-3 text-left">Order ID</th><th class="px-4 py-3 text-left">Customer</th><th class="px-4 py-3 text-left">Items</th><th class="px-4 py-3 text-left">Total</th><th class="px-4 py-3 text-left">Status</th><th class="px-4 py-3 text-left">Date</th></tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan="6" class="text-center py-8"><div class="loader"></div> Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="bg-gray-800 text-white text-center py-6 mt-12">
    <p>&copy; 2025 Spice & Crust - Authentic Indian Bakery. All rights reserved.</p>
  </footer>

  <script src="js/admin.js"></script>
  <script>
    if (!localStorage.getItem('adminLoggedIn')) window.location.href = 'admin-login.html';
    document.getElementById('logout-btn')?.addEventListener('click', () => {
      localStorage.removeItem('adminLoggedIn');
      window.location.href = 'admin-login.html';
    });
  </script>
</body>
</html>
