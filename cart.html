<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Spice & Crust Bakery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center flex-wrap">
      <a href="index.html" class="text-2xl font-bold" style="color: #ea580c"><i class="fas fa-utensils"></i> Spice & Crust</a>
      <div class="space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-orange-600 transition">Home</a>
        <a href="menu.html" class="text-gray-700 hover:text-orange-600 transition">Menu</a>
        <a href="cart.html" class="font-semibold" style="color: #ea580c">Cart 🛒</a>
        <a href="order.html" class="text-white px-4 py-2 rounded-full hover:bg-orange-700 transition" style="background-color: #ea580c">Order Now</a>
        <a href="admin-login.html" class="text-gray-700 hover:text-orange-600 transition">Admin</a>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Shopping Cart</h1>
    <div id="cart-items" class="bg-white rounded-lg shadow-md p-6 mb-6"></div>
    <div id="cart-summary" class="bg-white rounded-lg shadow-md p-6 text-right">
      <p class="text-xl font-semibold">Total: ₹<span id="cart-total">0.00</span></p>
      <button id="checkout-btn" class="mt-4 text-white px-8 py-3 rounded-full text-lg font-semibold transition transform hover:scale-105" style="background-color: #ea580c">Proceed to Checkout</button>
    </div>
  </div>

  <footer class="bg-gray-800 text-white text-center py-6 mt-12">
    <p>&copy; 2025 Spice & Crust - Authentic Indian Bakery. All rights reserved.</p>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
