<!-- frontend/menu.html - Fixed category buttons -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Spice & Crust Bakery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 theme-warm">
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4">
      <div class="flex justify-between items-center flex-wrap">
        <a href="/" class="text-2xl font-bold" style="color: var(--primary)"><i class="fas fa-utensils"></i> Spice & Crust</a>
        <div class="space-x-6">
          <a href="/" class="text-gray-700 hover:transition">Home</a>
          <a href="/menu.html" class="font-semibold" style="color: var(--primary)">Menu</a>
          <a href="/about.html" class="text-gray-700 hover:transition">About</a>
          <a href="/contact.html" class="text-gray-700 hover:transition">Contact</a>
          <a href="/order.html" class="text-white px-4 py-2 rounded-full hover:transition" style="background-color: var(--primary)">Order Now</a>
          <a href="/cart.html" class="text-gray-700 hover:transition relative">
            <i class="fas fa-shopping-bag"></i> Cart
            <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-4">Our Menu</h1>
    <p class="text-center text-gray-600 mb-12">Discover our delicious range of Indian bakery items</p>
    
    <!-- Category Filters - FIXED: Removed inline style from first button -->
    <div class="flex justify-center gap-4 mb-8 flex-wrap">
      <button class="filter-btn active bg-orange-600 text-white px-6 py-2 rounded-full transition-all duration-300" data-category="all">All Items</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="Bread">Breads</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="Paratha">Parathas</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="Snacks">Snacks</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="Sweet">Sweets</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="South Indian">South Indian</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="Street Food">Street Food</button>
      <button class="filter-btn bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-orange-600 hover:text-white transition-all duration-300" data-category="Main Course">Main Course</button>
    </div>
    
    <div id="full-menu-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Products loaded dynamically -->
    </div>
  </div>

  <!-- Theme Toggle Button -->
  <div class="theme-toggle-btn bg-white shadow-lg rounded-full">
    <button id="theme-toggle" class="flex items-center gap-2 px-4 py-2 rounded-full" style="color: var(--primary)">
      <i class="fas fa-palette"></i>
      <span class="hidden sm:inline">Themes</span>
    </button>
  </div>

  <!-- Theme Menu -->
  <div id="theme-menu" class="fixed bottom-20 right-20 bg-white rounded-lg shadow-xl z-50 hidden w-48">
    <div class="p-2">
      <h3 class="text-sm font-semibold text-gray-600 px-3 py-2">Choose Theme</h3>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="warm">
        <div class="w-6 h-6 rounded-full bg-orange-600"></div>
        <span>Warm Bakery</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="green">
        <div class="w-6 h-6 rounded-full bg-green-600"></div>
        <span>Fresh & Green</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="purple">
        <div class="w-6 h-6 rounded-full bg-purple-600"></div>
        <span>Royal Purple</span>
      </div>
      <div class="theme-option flex items-center gap-3 px-3 py-2 cursor-pointer rounded-lg hover:bg-gray-100" data-theme="red">
        <div class="w-6 h-6 rounded-full bg-red-600"></div>
        <span>Red & Spicy</span>
      </div>
    </div>
  </div>

  <footer class="bg-gray-900 text-white pt-12 pb-6 mt-12">
    <div class="container mx-auto px-4 text-center">
      <p>&copy; 2025 Spice & Crust - Authentic Indian Bakery. All rights reserved.</p>
    </div>
  </footer>
  
  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
